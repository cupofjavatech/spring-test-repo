server:
  port: 8201
  
spring:
  datasource:
    url: "jdbc:h2:mem:passenger-dev"
    driverClassName: "org.h2.Driver"
    username: sa
    password: password
  h2: 
    console:
      path: "/h2-console"
      enabled: "true"
      settings:
        trace: "false"
        web-allow-others: "false"
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    defer-datasource-initialization: "true"
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        format-sql: "true"
  sql:
    init.mode: "always"

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  info:
    env:
      enabled: true
      
info:
  app:
    encoding: UTF-8
    java:
      source: 17
    name: Spring Passenger Service (Profile - Dev) - V3
